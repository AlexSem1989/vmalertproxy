apiVersion: 1
datasources:
  # Test sites msk and spb.
  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      # Show datasource-managed rules in Grafana Alerting.
      manageAlerts: true
  # Backends from vmalertsproxy-host.yaml.
  - name: VictoriaMetrics host
    type: prometheus
    uid: victoriametrics-host
    access: proxy
    url: http://victoriametrics-host:8428
    jsonData:
      manageAlerts: true
